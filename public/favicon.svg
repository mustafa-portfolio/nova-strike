<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="hull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#3a86ff" />
      <stop offset="100%" stop-color="#001845" />
    </linearGradient>
    <linearGradient id="cockpit" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00d4ff" />
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffbe0b" />
      <stop offset="50%" stop-color="#fb5607" />
      <stop offset="100%" stop-color="#ff006e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="#060814" />
  <!-- Thruster flame -->
  <polygon points="44,72 50,94 56,72" fill="url(#flame)" filter="url(#glow)" />
  <!-- Wings -->
  <polygon points="50,22 15,72 32,68 50,60 68,68 85,72" fill="url(#hull)" filter="url(#glow)" />
  <!-- Wing cannons -->
  <rect x="22" y="52" width="4" height="16" rx="2" fill="#00f5ff" />
  <rect x="74" y="52" width="4" height="16" rx="2" fill="#00f5ff" />
  <!-- Fuselage -->
  <polygon points="50,14 38,62 50,56 62,62" fill="#ffffff" />
  <polygon points="50,16 40,60 50,55 60,60" fill="url(#hull)" />
  <!-- Cockpit -->
  <ellipse cx="50" cy="38" rx="5" ry="12" fill="url(#cockpit)" filter="url(#glow)" />
</svg>
